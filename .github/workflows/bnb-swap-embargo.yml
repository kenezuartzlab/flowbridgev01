name: BNB Swap publication embargo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bunx vitest run scripts/bnb-swap-embargo.test.ts src/lib/swap/viewContext.test.ts src/lib/bnb/launchReadiness.test.ts --maxWorkers=2
      - run: bun run build
